name: EduCards Release (Android)

# Android 版の APK を作り、署名して GitHub の Releases に置く。
# タグ educards-v1.2.3 を push したときと、手動で起動したときに動く。
#
# 必要な秘密の値（Settings > Secrets and variables > Actions）
#   EDUCARDS_KEYSTORE_BASE64   署名の鍵のファイル（.jks）を base64 にしたもの
#   EDUCARDS_KEYSTORE_PASSWORD 鍵のファイルのパスワード
#   EDUCARDS_KEY_ALIAS         鍵の別名
#   EDUCARDS_KEY_PASSWORD      鍵のパスワード
# 鍵はこのジョブの中で一時的にファイルに戻し、終わったら消す。ログには出さない。
on:
  push:
    tags: ['educards-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'リリースに付けるタグ（例: educards-v1.0.0）。無ければ作る'
        required: true

permissions:
  contents: read

concurrency:
  group: educards-release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write      # Releases にファイルを置く
      id-token: write      # ビルドの出どころの証明（attestation）
      attestations: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: educards
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag format
        run: |
          if ! [[ "$TAG" =~ ^educards-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like educards-v1.2.3 (got: $TAG)"
            exit 1
          fi

      - name: Check that the version in pubspec.yaml matches the tag
        run: |
          version=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          if [ "educards-v$version" != "$TAG" ]; then
            echo "::error::pubspec.yaml version ($version) does not match tag ($TAG)"
            exit 1
          fi

      - name: Check that the signing secrets are set
        env:
          KEYSTORE_BASE64: ${{ secrets.EDUCARDS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.EDUCARDS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EDUCARDS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EDUCARDS_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret EDUCARDS_$name is not set"
              exit 1
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EDUCARDS_KEYSTORE_BASE64 }}
        run: |
          keystore="$RUNNER_TEMP/educards-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "EDUCARDS_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          EDUCARDS_KEYSTORE_PASSWORD: ${{ secrets.EDUCARDS_KEYSTORE_PASSWORD }}
          EDUCARDS_KEY_ALIAS: ${{ secrets.EDUCARDS_KEY_ALIAS }}
          EDUCARDS_KEY_PASSWORD: ${{ secrets.EDUCARDS_KEY_PASSWORD }}
        # --obfuscate: 中身を読み解きにくくする（mobile-security ルール 5）
        # 読み解き用の表（symbols）は Releases には置かず、Actions の成果物にだけ残す
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols --strip

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/educards-release.jks"

      - name: Rename APKs and write checksums
        id: files
        run: |
          version="${TAG#educards-v}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/EduCards-$version-$abi.apk"
          done
          # いつでも同じ URL で最新版を取れるよう、版の番号なしの名前も置く
          cp "dist/EduCards-$version-arm64-v8a.apk" dist/EduCards-arm64-v8a.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Show the signing certificate
        id: cert
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs dist/EduCards-arm64-v8a.apk \
            | tee dist/signing-certificate.txt
          fingerprint=$(grep -m1 'SHA-256 digest' dist/signing-certificate.txt | awk '{print $NF}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Attest where the APKs were built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: educards/dist/*.apk

      - name: Keep the symbols (for reading crash reports)
        uses: actions/upload-artifact@v4
        with:
          name: educards-symbols-${{ env.TAG }}
          path: educards/build/symbols
          retention-days: 90

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          FINGERPRINT: ${{ steps.cert.outputs.fingerprint }}
        run: |
          cat > dist/notes.md <<EOF
          EduCards（Android 版）です。入れ方は [Android に入れる方法](https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/android.html) を見てください。

          | ファイル | 向いている端末 |
          |---|---|
          | \`EduCards-arm64-v8a.apk\` | ほとんどのスマホ（迷ったらこれ） |
          | \`EduCards-*-armeabi-v7a.apk\` | 古いスマホ |
          | \`EduCards-*-x86_64.apk\` | パソコン上のエミュレーター |

          **ファイルが本物か確かめる:** \`SHA256SUMS.txt\` の値と、ダウンロードしたファイルの SHA-256 を比べてください。
          署名の証明書の SHA-256: \`$FINGERPRINT\`
          EOF
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt dist/signing-certificate.txt \
            --title "EduCards ${TAG#educards-v}（Android）" \
            --notes-file dist/notes.md \
            --target "$GITHUB_SHA" \
            --latest
