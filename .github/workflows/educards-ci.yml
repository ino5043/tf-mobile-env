name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: educards

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
        working-directory: educards

      - name: Analyze project source
        run: flutter analyze --no-fatal-infos
        working-directory: educards

      - name: Run tests
        run: flutter test --coverage --reporter json > test-results/junit.xml || true
        working-directory: educards

      - name: Run tests (verbose)
        run: flutter test --coverage
        working-directory: educards

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: educards/coverage/
          retention-days: 90
        if: always()

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: educards

      - name: Build Web
        run: flutter build web --release --base-href "/12_tf-mobile-env/"
        working-directory: educards

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.sha }}
          path: educards/build/web/
          retention-days: 90
