name: educards
description: "EduCards - Spaced Repetition Flashcard Learning App. Built with tf-mobile-env."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # DI
  get_it: ^8.0.3

  # Navigation
  go_router: ^15.1.2

  # Local Storage (Offline-First)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4

  # Charts
  fl_chart: ^0.70.2

  # File Import
  file_picker: ^10.0.0
  csv: ^6.0.0

  # HTTP (Claude API)
  http: ^1.2.0

  # TTS (Text-to-Speech)
  flutter_tts: ^4.2.0

  # API キーの保存（Android: Keystore、iOS: キーチェーン）
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # Code Generation (none needed - manual TypeAdapters)

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/data/
